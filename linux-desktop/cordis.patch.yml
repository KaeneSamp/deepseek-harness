# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
- id: llm-pi-ai
  config:
    providers:
      free-claude-code:
        displayName: Free Claude Code (NVIDIA NIM)
        apiKeyEnv: FCC_DSH_DESKTOP_API_KEY
        api: openai-responses
        baseURL: http://127.0.0.1:8082/v1
        models:
          # --- Modelos de Raciocínio (Reasoning) ---
          - id: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
            name: "Nemotron 3 Ultra 550B"
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            contextWindow: 200000
            maxTokens: 8192

          - id: nvidia_nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
            name: "Nemotron 3 Nano Omni 30B (Reasoning)"
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            contextWindow: 128000
            maxTokens: 4096

          - id: nvidia_nim/deepseek-ai/deepseek-v4.1-flash
            name: "DeepSeek V4.1 Flash"
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            contextWindow: 128000
            maxTokens: 8192

          - id: kimi/kimi-k2.7-code
            name: "Kimi K2.7 Code"
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            contextWindow: 200000
            maxTokens: 8192

          - id: nvidia_nim/stepfun-ai/step-5-preview
            name: "StepFun Step 5 Preview"
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            contextWindow: 128000
            maxTokens: 4096

          # --- Modelos Padrão (Sem Raciocínio / Chat & Visão) ---
          - id: nvidia_nim/mistralai/mistral-large-4-1t-a52b
            name: "Mistral Large 4 (1T MoE)"
            reasoningEfforts: false
            contextWindow: 128000
            maxTokens: 4096

          - id: nvidia_nim/meta/llama-3.2-90b-vision-instruct
            name: "Llama 3.2 90B Vision"
            reasoningEfforts: false
            contextWindow: 32768
            maxTokens: 4096
            input:
              - text
              - image

          - id: nvidia_nim/meta/llama-3.2-11b-vision-instruct
            name: "Llama 3.2 11B Vision"
            reasoningEfforts: false
            contextWindow: 32768
            maxTokens: 4096
            input:
              - text
              - image

          - id: nvidia_nim/z-ai/glm-5.3-flash
            name: "GLM 5.3 Flash"
            reasoningEfforts: false
            contextWindow: 128000
            maxTokens: 4096

          - id: nvidia_nim/minimaxai/minimax-m3.1-flash
            name: "MiniMax M3.1 Flash"
            reasoningEfforts: false
            contextWindow: 128000
            maxTokens: 4096

          - id: nvidia_nim/google/gemma-4-31b-it
            name: "Gemma 4 31B IT"
            reasoningEfforts: false
            contextWindow: 128000
            maxTokens: 4096

          - id: nvidia_nim/google/diffusiongemma-26b-a4b-it
            name: "Diffusion Gemma 26B-A4B IT"
            reasoningEfforts: false
            contextWindow: 128000
            maxTokens: 4096

          - id: nvidia_nim/nvidia/nemotron-3.5-super-vl-120b-a12b
            name: "Nemotron 3.5 Super VL 120B"
            reasoningEfforts: false
            contextWindow: 128000
            maxTokens: 4096
            input:
              - text
              - image

          - id: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b
            name: "Nemotron 3.5 Lightning 30B"
            reasoningEfforts: false
            contextWindow: 128000
            maxTokens: 4096

          - id: nvidia_nim/nvidia/nemotron-3.5-bolt-e4b
            name: "Nemotron 3.5 Bolt E4B"
            reasoningEfforts: false
            contextWindow: 65536
            maxTokens: 4096

          - id: nvidia_nim/openai/gpt-oss-20b
            name: "GPT OSS 20B"
            reasoningEfforts: false
            contextWindow: 65536
            maxTokens: 4096

          - id: nvidia_nim/poolside/laguna-xs-2.1
            name: "Poolside Laguna XS 2.1"
            reasoningEfforts: false
            contextWindow: 65536
            maxTokens: 4096

          - id: kimi/kimi-k2.6
            name: "Kimi K2.6"
            reasoningEfforts: false
            contextWindow: 200000
            maxTokens: 4096

          # --- Modelos Locais Ollama ---
          - id: ollama/hf.co/culturerevolt/gemma-4-12b-heretic-abliterated-GGUF:IQ4_XS
            name: "Gemma 4 12B Heretic (Ollama)"
            reasoningEfforts: false
            contextWindow: 32768
            maxTokens: 4096

          - id: ollama/gemma-32k:latest
            name: "Gemma 32K (Ollama)"
            reasoningEfforts: false
            contextWindow: 32768
            maxTokens: 4096
        defaultInput:
          - text
        retryPolicy:
          mode: normal
          maxRetries: 1
        streamIdleTimeoutMs: 660000
- id: agent-default-model
  config:
    provider: free-claude-code
    model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
    reasoningEffort: max
